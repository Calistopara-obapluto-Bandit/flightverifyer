<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking dossier — AiroPack</title>
  <meta name="description" content="Parcel tracking dossier: routing, courier, customs, scan history and delivery record.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#16211f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/" aria-label="AiroPack home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M4 22.5 13.5 9l7 10.5L28 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13.5" cy="9" r="2.4" fill="currentColor"/><circle cx="28" cy="6" r="2.4" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">Airo<em>Pack</em></span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a class="nav-link" href="/">Flight verification</a>
        <a class="nav-link is-active" href="/track" aria-current="page">Track a parcel</a>
      </nav>
      <p class="ledger-state"><span class="pulse" aria-hidden="true"></span> Parcel desk online</p>
    </div>
  </header>

  <main id="main" class="shell parcel-main">
    <div class="print-brand" aria-hidden="true">airopack</div>
    <div class="parcel-toolbar">
      <a class="btn btn-ghost btn-small" href="/track">← Track another parcel</a>
      <button type="button" class="btn btn-ghost btn-small" id="print-dossier">Print dossier</button>
    </div>
    <section id="parcel-root" aria-live="polite">
      <p class="parcel-loading mono">Reading the parcel ledger…</p>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <p>AiroPack · Parcel tracking desk</p>
      <p class="mono">Scans are taken from the dispatch ledger at the moment you check.</p>
      <p><a class="link-button" href="/">Flight verification</a> · <a class="link-button" href="/#support">Support desk</a></p>
    </div>
  </footer>

  <script src="/parcel.js" defer></script>
</body>
</html>
